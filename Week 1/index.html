
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Notices</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="page-container">

       <header class="header">

    <div class="logo">
        <img src="./images/dmmmsu.logo.png" alt="DMMMSU Logo">
    </div>

    <div class="university-name">
        <h1>Don Mariano Marcos Memorial State University</h1>
        <p>South La Union Campus</p>
    </div>

</header>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
        </nav>

        <section class="main-content">

            <div class="notices-section">

                <h2>Campus Notices</h2>

                <div class="notices-gallery">

                    <div class="notice-card">
                        <img src="./images/pnle1.webp" alt="Campus Notice 1">
                    </div>

                    <div class="notice-card">
                        <img src="./images/lpt.webp" alt="Campus Notice 2">
                    </div>

                    <div class="notice-card">
                        <img src="./images/mfle.webp" alt="Campus Notice 3">
                    </div>

                </div>

            </div>

            <div class="post-section">

                <h2>Post a Notice</h2>

                <form>

                    <label for="title">Title of Notice:</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter notice title"
                    >

                    <label for="message">Write a message:</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="8"
                        placeholder="Write your notice here..."
                    ></textarea>

                    <button type="submit">Post</button>

                </form>

            </div>

        </section>

        <footer class="footer">
            <h3>College of Computer Science</h3>
            <p>All Rights Reserved at 2027</p>
        </footer>

    </main>

</body>
</html>
